<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="StarField Big Tree">
<title>Chemical Bonding Lab v1.0</title>
<!-- Chemical Bonding Lab: offline single-file app. Runs locally in the browser; nothing is uploaded. -->
<style>
/* PATCH-START: styles */
:root{
  --lab-phase:83 70 66 84;
  --bg:#f3f5fa; --bg-glow:rgba(99,102,241,.10); --bg-glow2:rgba(20,184,166,.08);
  --card:#ffffff; --card2:#f8fafc; --ink:#0f172a; --ink2:#475569; --ink3:#8a96ab; --line:#e3e8f1; --line2:#d5dce8;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef0ff; --accent2:#0d9488;
  --ok:#059669; --ok-soft:#e8f8f1; --bad:#e11d48; --bad-soft:#fff0f3; --warn:#b45309; --warn-soft:#fff7e6;
  --stage:#fbfcfe; --stage-dot:#dfe5ef;
  --shell:#b3bdcc; --shell-v:#6b7a93; --vac-fill:#fbfcfe; --vac:#9aa6b8;
  --e-m:#7c3aed; --e-h:#0891b2; --e-r:#e11d48; --e-a:#d97706; --e-g:#16a34a;
  --lens:rgba(124,58,237,.10);
  --dp:#e11d48; --dm:#2563eb;
  --hb:#0d9488;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px -12px rgba(15,23,42,.14);
  --radius:18px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#080d1a; --bg-glow:rgba(99,102,241,.16); --bg-glow2:rgba(20,184,166,.10);
  --card:#0f1628; --card2:#131c31; --ink:#e7ebf5; --ink2:#a6b1c8; --ink3:#6b7790; --line:#1d2842; --line2:#26334f;
  --accent:#8b93ff; --accent-ink:#0b1020; --accent-soft:#1a2046; --accent2:#2dd4bf;
  --ok:#34d399; --ok-soft:#0e2a22; --bad:#fb7185; --bad-soft:#2d121b; --warn:#fbbf24; --warn-soft:#2a2008;
  --stage:#070b17; --stage-dot:#162039;
  --shell:#3b4a66; --shell-v:#8193b5; --vac-fill:#070b17; --vac:#62718f;
  --e-m:#a78bfa; --e-h:#22d3ee; --e-r:#fb7185; --e-a:#fbbf24; --e-g:#4ade80;
  --lens:rgba(167,139,250,.14);
  --dp:#fb7185; --dm:#60a5fa;
  --hb:#2dd4bf;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(900px 500px at -10% -10%,var(--bg-glow),transparent 60%),radial-gradient(800px 500px at 110% 0%,var(--bg-glow2),transparent 55%);
  background-attachment:fixed;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,svg:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
sub,sup{line-height:0}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 22px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none;background:none;border:0;padding:4px 6px;border-radius:12px;text-align:left}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:16px;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;font-size:11.5px;color:var(--ink3);line-height:1.2}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.nav::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;font-size:13px;color:var(--ink2);transition:background .15s,border-color .15s,color .15s}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill .pn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.active .pn{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);border-color:transparent;color:var(--accent-ink)}
.pill.done .pn{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.home{padding:6px 12px}
.top-actions{display:flex;gap:6px;flex:none}
.icon-btn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{color:var(--ink);border-color:var(--line2)}
.icon-btn svg{width:18px;height:18px}

/* ---------- layout ---------- */
main{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:20px 22px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.station{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;align-items:start}
.station[hidden],.home[hidden]{display:none}

/* ---------- guide ---------- */
.guide{position:sticky;top:78px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);overflow:hidden}
.g-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.g-kicker{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.g-head h2{margin:2px 0 10px;font-size:21px;letter-spacing:-.015em;line-height:1.2}
.g-dots{display:flex;gap:6px;flex-wrap:wrap}
.g-dot{height:8px;flex:1;min-width:18px;border-radius:99px;border:0;background:var(--line);cursor:pointer;padding:0}
.g-dot.done{background:var(--ok)}
.g-dot.cur{background:var(--accent)}
.g-dot:disabled{cursor:default;opacity:.55}
.g-body{padding:16px 20px;overflow-y:auto;flex:1}
.g-num{font-size:12px;color:var(--ink3);font-weight:600}
.g-body h3{margin:2px 0 8px;font-size:17px;letter-spacing:-.01em}
.g-text{color:var(--ink2);font-size:14.5px}
.g-text p{margin:0 0 10px}
.g-text b,.g-text strong{color:var(--ink)}
.g-text ul{margin:4px 0 10px;padding-left:18px}
.g-text li{margin:3px 0}
.defs{display:grid;gap:8px;margin:6px 0 12px}
.def{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 11px;font-size:13.5px;color:var(--ink2)}
.def b{color:var(--ink)}
.blk{border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:12px 0;background:var(--card2)}
.blk-lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.task{display:flex;gap:11px;align-items:flex-start;border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft)}
.task .blk-lab{color:var(--accent)}
.task .tick{width:24px;height:24px;border-radius:50%;flex:none;border:2px solid var(--accent);margin-top:2px;display:grid;place-items:center}
.task.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-soft)}
.task.done .blk-lab{color:var(--ok)}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.task .tick svg{width:14px;height:14px}
.task-t{font-size:14.5px;color:var(--ink)}
.task-d{font-size:13.5px;color:var(--ink2);margin-top:5px}
.check .q{margin:2px 0 10px;font-weight:600;font-size:14.5px;color:var(--ink)}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line2);background:var(--card);border-radius:11px;padding:9px 11px;cursor:pointer;font-size:14px;line-height:1.35;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .ok-l{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--line2);color:var(--ink3);margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ok-l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.85}
.opt.wrong .ok-l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.fb{font-size:13.5px;margin-top:9px;padding:8px 10px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.fb b{color:inherit}
.note{background:var(--card);font-size:14px;color:var(--ink2)}
.note.key{border-color:color-mix(in srgb,var(--accent2) 45%,var(--line));background:color-mix(in srgb,var(--accent2) 8%,var(--card))}
.note.key b{color:var(--ink)}
.locked{display:flex;gap:9px;align-items:center;color:var(--ink3);font-size:13.5px;border-style:dashed;background:transparent}
.locked svg{width:16px;height:16px;flex:none}
.g-nav{display:flex;gap:10px;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);background:var(--card)}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover:not(:disabled){border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}

/* ---------- stage ---------- */
.stage{overflow:hidden;display:flex;flex-direction:column}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.stage-title{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:8px}
.stage-title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 18%,transparent)}
.stage-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.tool:hover{color:var(--ink);border-color:var(--ink3)}
.tool.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tool svg{width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;padding:2px;background:var(--card2);gap:2px}
.seg .tool{border:0;background:transparent;border-radius:8px;padding:5px 10px}
.seg .tool.on{background:var(--accent);color:var(--accent-ink)}
.range{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:600}
.range input{accent-color:var(--accent);width:150px}
.stage-html:empty{display:none}
.stage-html{padding:14px 14px 0}
.svg-wrap{position:relative;background:var(--stage);background-image:radial-gradient(var(--stage-dot) 1px,transparent 1.2px);background-size:22px 22px;border-top:1px solid transparent}
.svg-wrap[hidden]{display:none}
#svg:focus{outline:none}
#svg:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-3px}
#svg{display:block;width:100%;height:auto;max-height:min(66vh,620px);touch-action:none;user-select:none;-webkit-user-select:none}
.toast{position:fixed;z-index:40;left:50%;bottom:26px;transform:translate(-50%,10px);opacity:0;pointer-events:none;max-width:min(92%,560px);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:550;background:var(--ink);color:var(--card);box-shadow:var(--shadow);transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--ok);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
.stage-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);min-height:40px}
.stage-foot:empty{display:none}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.lg i.vac{background:transparent;border:1.6px solid var(--vac)}
.lg i.m{background:var(--e-m)} .lg i.h{background:var(--e-h)} .lg i.r{background:var(--e-r)} .lg i.a{background:var(--e-a)}
.lg i.dp{background:var(--dp)} .lg i.dm{background:var(--dm)}
.lg i.hb{width:18px;height:0;border-radius:0;border-top:2.5px dotted var(--hb)}
.lg-tip{margin-left:auto;color:var(--ink3)}

/* ---------- SVG ---------- */
.shell{fill:none;stroke:var(--shell);stroke-width:1.4}
.shell-v{stroke:var(--shell-v);stroke-width:1.9}
.shell.ghost{stroke-dasharray:4 5}
.shell-build{fill:none;stroke:var(--shell);stroke-width:1.6;stroke-dasharray:5 6}
.shell-build.flash{stroke:var(--bad);stroke-width:3}
.shell-build.hot{stroke:var(--accent);stroke-width:2.4}
.nuc{stroke:rgba(0,0,0,.18);stroke-width:1}
.nuc-t{fill:#fff;font-weight:750;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.28);stroke-width:1.4px;pointer-events:none;font-family:var(--font)}
.lewis-sym{fill:var(--ink);font-weight:700;text-anchor:middle;font-family:var(--font)}
.e{stroke:var(--stage);stroke-width:1.2}
html[data-theme="dark"] .e{filter:url(#glow)}
.ek-m{fill:var(--e-m)} .ek-h{fill:var(--e-h)} .ek-r{fill:var(--e-r)} .ek-a{fill:var(--e-a)} .ek-g{fill:var(--e-g)}
.e-sel{stroke:var(--ink);stroke-width:2.5}
.vac{fill:var(--vac-fill);stroke:var(--vac);stroke-width:1.5}
.vac-hl{stroke:var(--accent);stroke-width:2.6}
.lens{fill:var(--lens);stroke:none}
.t{fill:var(--ink2);font-family:var(--font);text-anchor:middle}
.t-b{fill:var(--ink);font-weight:650}
.t-s{font-size:12.5px;fill:var(--ink3)}
.t-l{text-anchor:start} .t-r{text-anchor:end}
.t-ok{fill:var(--ok);font-weight:700}
.t-cap{fill:var(--ink);font-size:21px;font-weight:700;letter-spacing:-.01em}
.t-acc{fill:var(--accent);font-weight:700}
.badge{fill:var(--card);stroke:var(--line2);stroke-width:1}
.badge.full{fill:var(--ok-soft);stroke:var(--ok)}
.hit{fill:transparent;cursor:grab}
.hit.tap{cursor:pointer}
.hit-e{fill:transparent;cursor:grab}
.site{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 5;opacity:.7}
.site.hot{stroke-width:3;opacity:1;stroke-dasharray:none}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:.45}}
.sel-ring{fill:none;stroke:var(--accent);stroke-width:2.5}
.dp{fill:var(--dp);font-weight:750;font-family:var(--font);text-anchor:middle}
.dm{fill:var(--dm);font-weight:750;font-family:var(--font);text-anchor:middle}
.chg{stroke:var(--card);stroke-width:2}
.chg.p{fill:var(--dp)} .chg.m{fill:var(--dm)}
.chg-t{fill:#fff;font-weight:800;text-anchor:middle;font-family:var(--font);pointer-events:none}
.hbond{stroke:var(--hb);stroke-width:3;stroke-dasharray:1.5 6;stroke-linecap:round;fill:none}
.hb-lab{fill:var(--hb);font-weight:700;font-size:13px;text-anchor:middle;font-family:var(--font)}
.pair-glow{fill:none;stroke-width:3}
.pair-glow.good{stroke:var(--ok)} .pair-glow.bad{stroke:var(--bad)} .pair-glow.none{stroke:var(--ink3);stroke-dasharray:4 4}
.arrow{stroke-width:3;fill:none;stroke-linecap:round}
.arrow.blue{stroke:var(--dm)} .arrow.green{stroke:var(--ok)} .arrow.red{stroke:var(--dp)} .arrow.ink{stroke:var(--ink3)}
.axis{stroke:var(--ink3);stroke-width:1.5}
.tick{stroke:var(--ink3);stroke-width:1}
.en-mark{cursor:pointer}
.stem{stroke:var(--line2);stroke-width:1.5}
.zone{opacity:.9}
.cloud{pointer-events:none}
.attract{stroke:var(--accent2);stroke-width:4;stroke-linecap:round;fill:none;opacity:.85}
.rot-knob{fill:var(--card);stroke:var(--accent);stroke-width:2.5;cursor:grab}
.rot-arc{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 5;opacity:.55}
.lat-na{fill:url(#g-Na)} .lat-cl{fill:url(#g-Cl)}
.seta{stroke:var(--ink3);stroke-width:1.4;fill:none;stroke-linecap:round}
.glass{fill:color-mix(in srgb,#38bdf8 16%,transparent);stroke:#38bdf8;stroke-width:1.5}
.toe{fill:color-mix(in srgb,#84cc16 30%,var(--card));stroke:#65a30d;stroke-width:1.5}
.meter-bg{fill:var(--card2);stroke:var(--line2)}
.meter-fill{fill:var(--accent2)}
.weight-line{stroke:var(--bad);stroke-width:2.5;stroke-dasharray:6 4}

/* ---------- periodic table ---------- */
.pt-wrap{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.pt-cols{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;grid-column:2}
.pt-cols span{text-align:center;font-size:11px;font-weight:700;color:var(--ink3)}
.pt-row-l{font-size:11px;font-weight:700;color:var(--ink3);writing-mode:horizontal-tb;text-align:right;white-space:nowrap}
.ptable{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.pt{position:relative;border:1px solid var(--line2);border-radius:10px;padding:5px 4px 4px;cursor:pointer;background:var(--card);text-align:center;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,border-color .12s,box-shadow .12s}
.pt:hover{transform:translateY(-1px);border-color:var(--ink3)}
.pt .z{position:absolute;top:3px;left:6px;font-size:10px;color:var(--ink3);font-weight:600}
.pt .s{font-size:18px;font-weight:750;line-height:1.05}
.pt .n{font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pt.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pt.seen::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pt.noble{background:color-mix(in srgb,#a855f7 9%,var(--card))}
.pt.spacer{visibility:hidden}
.info-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink2)}
.chip b{color:var(--ink)}
.chip.good{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.acc{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.build-card{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.build-card .tgt{font-size:15px}
.build-card .tgt b{font-size:17px}

/* ---------- summary ---------- */
.cloze{display:grid;gap:10px;padding:4px 2px 14px}
.cz{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);font-size:15px;line-height:2.2}
.cz.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-soft)}
.cz .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700;margin-right:6px;color:var(--ink3);line-height:1}

.blank.bad{border-style:solid;border-color:var(--bad)}

.sorter{display:grid;gap:14px;padding-bottom:14px}

.pool:empty::before{content:"All sorted!";color:var(--ok);font-weight:600;font-size:14px;padding:4px}
.sc{border:1px solid var(--line2);background:var(--card);border-radius:11px;padding:8px 11px;font-size:13.5px;cursor:pointer;text-align:left;max-width:320px;line-height:1.35}

.sc.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sc.shake{animation:shake .38s;border-color:var(--bad)}
.sc.placed{cursor:default;background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent);font-size:12.5px}
.bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bin{border:1px solid var(--line);border-radius:14px;background:var(--card);min-height:170px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.bin.ready{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.bin h4{margin:0;padding:9px 11px;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.bin h4 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bin .items{display:flex;flex-direction:column;gap:6px;padding:9px}
.sort-fb{font-size:13.5px;min-height:20px}
.sort-fb.bad{color:var(--bad)} .sort-fb.good{color:var(--ok)}
.table-wrap{overflow-x:auto;padding-bottom:14px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:620px}

.cmp td:first-child{font-weight:650;white-space:nowrap}
.strength{display:inline-block;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));vertical-align:middle}
.cert{border:1px solid var(--line);border-radius:18px;padding:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 7%,var(--card)),color-mix(in srgb,var(--accent2) 7%,var(--card)));margin-bottom:14px}
.cert h3{margin:0 0 4px;font-size:22px;letter-spacing:-.015em}
.cert .sub{color:var(--ink2);font-size:14px;margin-bottom:14px}
.cert-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.stat .v{font-size:24px;font-weight:750;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink3);font-weight:600}
.name-in{border:1px solid var(--line2);border-radius:11px;padding:9px 12px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);width:min(100%,340px)}
.st-list{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none;font-size:13.5px}
.st-list li{display:flex;gap:8px;align-items:center;color:var(--ink2)}
.st-list .mk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.st-list .mk.y{background:var(--ok);color:#fff} .st-list .mk.n{background:var(--line);color:var(--ink3)}

/* ---------- home ---------- */
.home{display:grid;gap:20px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;padding:28px;align-items:center;overflow:hidden}
.hero h2{font-size:clamp(26px,3.2vw,38px);line-height:1.08;letter-spacing:-.025em;margin:6px 0 12px}
.hero p{color:var(--ink2);font-size:15.5px;margin:0 0 16px;max-width:560px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2)}
.hero-art svg{width:100%;height:auto;display:block}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.model-note{margin-top:16px;font-size:13px;color:var(--ink3);border-left:3px solid var(--line2);padding-left:10px;max-width:560px}
.grid-st{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.st-card{padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.st-card:hover{transform:translateY(-2px);border-color:var(--line2)}
.st-card .row{display:flex;justify-content:space-between;align-items:center}
.st-card .num{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.st-card h3{margin:0;font-size:17px;letter-spacing:-.01em}
.st-card p{margin:0;color:var(--ink2);font-size:13.5px}
.st-card .prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}

.st-card .meta{font-size:12px;color:var(--ink3)}
.st-card .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft)}
.st-card .ic svg{width:26px;height:26px}
.ladder{padding:18px 20px}
.ladder h3{margin:0 0 10px;font-size:15px}

.lad .bar i{display:block;height:100%;border-radius:99px}
.lad .w{color:var(--ink3);font-size:12px;white-space:nowrap}
footer{padding:14px 22px 22px;text-align:center;font-size:12px;color:var(--ink3)}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,12,24,.45);backdrop-filter:blur(3px);padding:16px}

.modal .box{max-width:420px;width:100%;padding:20px}
.modal h3{margin:0 0 6px}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .station{grid-template-columns:1fr}
  .guide{position:static;max-height:none}
  .hero{grid-template-columns:1fr}
  .bins{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand p{display:none}
}
@media (max-width:640px){

  .station{display:flex;flex-direction:column;gap:14px}
  .stage{order:-1}
  .stage:not(.has-html):not(.no-svg){position:sticky;top:0;z-index:15;box-shadow:0 10px 24px -12px rgba(15,23,42,.35)}
  .stage-bar{padding:7px 10px}
  .stage-foot{padding:6px 10px;gap:10px;font-size:11.5px;min-height:0}
  .lg-tip{display:none}
  #svg{max-height:40vh}
  .nav{order:3;flex-basis:100%}
  main{padding:14px 12px 20px}
  .pill{font-size:12px}
  .pill .pl{display:none}
  .pill{padding:5px}
  .pill.home{padding:5px 10px}
  .pt .n{display:none}
  .pt{min-height:42px}
  .pt .s{font-size:15px}
  .cert-grid{grid-template-columns:1fr}
  .lad{grid-template-columns:110px 1fr}
  .lad .w{display:none}
  .hero{padding:20px}
  .range input{width:110px}
}

}

  .station{display:block}
  .stage,.card{box-shadow:none;border:0}
  .cert{border:1px solid #999;background:#fff}
}

Guide.firstOpenFor = function (st) { for (let i = 0; i < st.steps.length; i++) if (!Store.stepDone(st.id, st.steps[i].id)) return i; return 0; };

const Theme = {

  set(t, save) {

  },
  toggle() { this.set(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true); },
